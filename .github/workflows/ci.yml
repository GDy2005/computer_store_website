name: Foundation and Phase 2 CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: source

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build containers
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Run smoke tests
        run: npm run smoke

      - name: Run event integration test
        run: docker compose exec -T identity-service node scripts/event-integration.js

      - name: Run authentication integration test
        run: npm run auth:integration

      - name: Run notification integration test
        run: npm run notification:integration

      - name: Capture Compose diagnostics
        if: ${{ always() }}
        run: |
          docker compose ps -a || true
          docker compose logs --no-color || true

      - name: Stop Compose stack
        if: ${{ always() }}
        run: docker compose down --volumes --remove-orphans
