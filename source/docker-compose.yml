name: computer-store

x-app: &app
  restart: unless-stopped
  init: true
  networks: [private]
  healthcheck:
    test: [CMD, node, -e, "fetch('http://localhost:'+process.env.PORT+'/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 15s
    timeout: 10s
    retries: 10
    start_period: 60s

x-core-env: &core-env
  NODE_ENV: development
  MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0
  KAFKA_BROKERS: kafka:9092
  INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-local-demo-internal-change-before-production}
  FOUNDATION_PROBES_ENABLED: ${FOUNDATION_PROBES_ENABLED:-true}

x-core-deps: &core-deps
  mongo-init: {condition: service_completed_successfully}
  kafka-init: {condition: service_completed_successfully}

services:
  mongo:
    image: mongo:7.0.26
    command: [mongod, --replSet, rs0, --bind_ip_all]
    restart: unless-stopped
    networks: [private]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 30
  mongo-init:
    image: mongo:7.0.26
    networks: [private]
    depends_on:
      mongo: {condition: service_healthy}
    volumes: [./infra/mongodb/init-replica-set.js:/init.js:ro]
    entrypoint: [mongosh, --host, mongo:27017, --quiet, /init.js]
  redis:
    image: redis:7.4-bookworm
    command: [redis-server, --appendonly, 'yes']
    restart: unless-stopped
    networks: [private]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  kafka:
    image: apache/kafka:3.9.2
    restart: unless-stopped
    networks: [private]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: [CMD, /opt/kafka/bin/kafka-topics.sh, --bootstrap-server, kafka:9092, --list]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
  kafka-init:
    image: apache/kafka:3.9.2
    networks: [private]
    depends_on:
      kafka: {condition: service_healthy}
    volumes: [./infra/kafka/create-topics.sh:/create-topics.sh:ro]
    entrypoint: [sh, /create-topics.sh]
  identity-service:
    <<: *app
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
      args: {SERVICE_PATH: services/identity-service}
    environment:
      <<: *core-env
      PORT: 5001
      DB_NAME: identity_db
    depends_on: *core-deps
  catalog-seed:
    build:
      context: .
      dockerfile: services/catalog-service/Dockerfile
      args: {SERVICE_PATH: services/catalog-service}
    command: [node, services/catalog-service/src/seeds/seedCategories.js]
    init: true
    restart: "no"
    networks: [private]
    environment:
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0
      DB_NAME: catalog_db
    depends_on:
      mongo-init: {condition: service_completed_successfully}
  catalog-service:
    <<: *app
    build:
      context: .
      dockerfile: services/catalog-service/Dockerfile
      args: {SERVICE_PATH: services/catalog-service}
    environment:
      <<: *core-env
      PORT: 5002
      DB_NAME: catalog_db
    depends_on:
      mongo-init: {condition: service_completed_successfully}
      kafka-init: {condition: service_completed_successfully}
      catalog-seed: {condition: service_completed_successfully}
  order-service:
    <<: *app
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
      args: {SERVICE_PATH: services/order-service}
    environment:
      <<: *core-env
      PORT: 5003
      DB_NAME: order_db
    depends_on: *core-deps
  notification-service:
    <<: *app
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
      args: {SERVICE_PATH: services/notification-service}
    environment:
      <<: *core-env
      PORT: 5004
      DB_NAME: notification_db
    depends_on: *core-deps
  analytics-service:
    <<: *app
    build:
      context: .
      dockerfile: services/analytics-service/Dockerfile
      args: {SERVICE_PATH: services/analytics-service}
    environment:
      <<: *core-env
      PORT: 5005
      DB_NAME: analytics_db
    depends_on: *core-deps
  gateway-1:
    <<: *app
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
      args: {SERVICE_PATH: api-gateway}
    environment:
      NODE_ENV: development
      PORT: 5000
      INSTANCE_ID: gateway-1
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:-local-demo-session-change-before-production}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-local-demo-internal-change-before-production}
      FOUNDATION_PROBES_ENABLED: ${FOUNDATION_PROBES_ENABLED:-true}
    depends_on:
      redis: {condition: service_healthy}
      identity-service: {condition: service_healthy}
      catalog-service: {condition: service_healthy}
      order-service: {condition: service_healthy}
      notification-service: {condition: service_healthy}
      analytics-service: {condition: service_healthy}
  gateway-2:
    <<: *app
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
      args: {SERVICE_PATH: api-gateway}
    environment:
      NODE_ENV: development
      PORT: 5000
      INSTANCE_ID: gateway-2
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:-local-demo-session-change-before-production}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-local-demo-internal-change-before-production}
      FOUNDATION_PROBES_ENABLED: ${FOUNDATION_PROBES_ENABLED:-true}
    depends_on:
      redis: {condition: service_healthy}
      identity-service: {condition: service_healthy}
      catalog-service: {condition: service_healthy}
      order-service: {condition: service_healthy}
      notification-service: {condition: service_healthy}
      analytics-service: {condition: service_healthy}
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    networks: [private]
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1/]
      interval: 10s
      timeout: 3s
      retries: 10
  nginx:
    image: nginx:1.28-bookworm
    restart: unless-stopped
    ports: ["${HTTP_PORT:-80}:80"]
    networks: [private]
    volumes: [./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro]
    depends_on:
      frontend: {condition: service_healthy}
      gateway-1: {condition: service_healthy}
      gateway-2: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1/health/ready]
      interval: 10s
      timeout: 5s
      retries: 10
networks:
  private:
    driver: bridge
volumes:
  mongo-data:
  redis-data:
  kafka-data:

