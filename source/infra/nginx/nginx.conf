events {}
http {
  upstream gateways { server gateway-1:5000; server gateway-2:5000; }
  server {
    listen 80;
    location /api/ { proxy_pass http://gateways; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
    location /health/ { proxy_pass http://gateways; }
    location / { proxy_pass http://frontend:80; proxy_set_header Host $host; }
  }
}
